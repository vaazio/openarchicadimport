<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>OPENARCHICADIMPORT</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px "Segoe UI",sans-serif;color:#202c32;background:#f6f7f7;height:100vh;display:grid;grid-template-rows:minmax(0,1fr) auto}main{display:grid;grid-template-columns:minmax(155px,21%) minmax(180px,1fr) minmax(200px,25%);min-height:0}aside{padding:14px;overflow:auto}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 7px}button,input,select{font:inherit;color:inherit}button,select,input[type=number]{border:1px solid #bdc8cb;background:white;border-radius:4px;padding:5px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,ui-tree-item:focus-visible{outline:2px solid #007f82}label{display:block;margin:6px 0}select{width:100%}input[type=number]{width:85px}#vista{position:relative;min-width:0;min-height:0;background:#e6eded;overflow:hidden}canvas{display:block;touch-action:none;width:100%;height:100%}#ferramentas,#medidas,#regua{position:absolute;background:#fffffff0;border-radius:4px;padding:6px}#ferramentas{top:8px;left:8px}#medidas{bottom:8px;left:8px}#regua{right:8px;bottom:42px;text-align:center;border-bottom:2px solid;pointer-events:none}footer{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #ccd4d6}#estado{flex:1}#criar{background:#00696c;color:white}ui-tree,ui-tree-item,ui-tree-item-label,ui-tree-group{display:block}ui-tree-item-label{padding:5px;cursor:pointer;overflow-wrap:anywhere;border-radius:3px}ui-tree-group{margin-left:9px}ui-tree-item[data-ativo]>ui-tree-item-label{background:#c3e4e2}ui-tree-item[data-fora]>ui-tree-item-label{text-decoration:line-through;color:#677}.acoes{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.linha{display:flex;gap:4px;align-items:center}.linha input{min-width:0;flex:1}hr{border:0;border-top:1px solid #ccd4d6;margin:12px 0}#limites label{display:flex;gap:4px;align-items:center}#limites input{width:40%}#contagem{font-variant-numeric:tabular-nums}#restaurar{margin-top:5px}
ui-slider,ui-slider-control,ui-slider-track,ui-slider-thumb,ui-slider-indicator{display:block}ui-slider-control{padding:9px 0;touch-action:none}ui-slider-track{position:relative;height:5px;background:#c1cdcc;border-radius:4px}ui-slider-thumb{position:absolute;width:16px;height:16px;border-radius:100%;background:#00696c;top:50%;transform:translate(-50%,-50%)}ui-slider-indicator{position:absolute;height:100%;background:#4d9995}ui-slider-thumb:focus-within{outline:2px solid #20464b}ui-number-input{min-width:0;flex:1}ui-number-input input{width:100%;padding:5px;border:1px solid #bdc8cb;border-radius:4px}ui-tree-group[hidden]{display:none}

[hidden]{display:none!important}#vista{display:grid;grid-template-rows:auto minmax(0,1fr)}#abas{display:flex;gap:4px;padding:6px;background:#f6f7f7;border-bottom:1px solid #cbd4d4}#abas button[aria-selected=true]{background:#176665;color:white}#area{min-height:0;position:relative}#planta{background:#fbfcfb}#ferramentas{display:flex;align-items:center;gap:6px}#ferramentas label{margin:0}#edicaoPlanta{padding:3px 0}#edicaoPlanta button{margin:2px 0}#nome{width:100%;padding:6px;border:1px solid #bdc8cb;border-radius:4px}#revisar,#disponibilidade{color:#864304}#zoom{display:flex;gap:2px}#selecao,#disponibilidade:empty,#revisar:empty{margin:0}#contagem,#selecao{line-height:1.5}
ui-tree-item-label{display:flex;align-items:center;gap:2px;padding:3px 1px}.nomePeca{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}ui-tree-item-label button{width:22px;height:24px;padding:2px;border:0;background:transparent;flex:none}ui-tree-item-label button:hover,ui-tree-item-label button:focus-visible{background:#dfebed}ui-tree-item-label svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#materiais button{display:block;width:100%;text-align:left;margin-top:3px}#materiais button:after{content:'▾';float:right}
#dica{position:fixed;z-index:4;pointer-events:none;background:#233238;color:white;border-radius:3px;padding:4px 7px}
#contexto,dialog{background:#fff;color:inherit;border:1px solid #aab6b9;border-radius:5px;padding:10px;box-shadow:0 3px 16px #0004}#contexto{position:fixed;z-index:5;display:grid;gap:3px;max-height:100vh;overflow:auto}#contexto button{text-align:left}#atualMenu{margin-bottom:5px}dialog::backdrop{background:#0006}
.escuro{color-scheme:dark}.escuro body,.escuro #abas{background:#24282c;color:#edf0f2}.escuro button,.escuro select,.escuro input,.escuro #nome,.escuro #contexto,.escuro dialog{background:#343a40;color:#edf0f2;border-color:#657078}.escuro #ferramentas,.escuro #medidas,.escuro #regua,.escuro #dica{background:#262c30;color:#fff}.escuro ui-tree-item[data-ativo]>ui-tree-item-label{background:#255655}.escuro ui-tree-item[data-fora]>ui-tree-item-label{color:#a9b4b9}.escuro ui-tree-item-label button:hover,.escuro ui-tree-item-label button:focus-visible{background:#47605e}.escuro #revisar,.escuro #disponibilidade{color:#ffbf79}.escuro #planta{background:#f2f4f4}
</style><main><aside><h2>Peças</h2><label><input type="checkbox" id="ilhas"> Separar peças desconectadas</label><ui-tree mode="multiple" id="arvore" aria-label="Peças do modelo"></ui-tree><p id="selecao"></p></aside>
<section id="vista"><div id="abas" role="tablist" aria-label="Vista"><button role="tab" aria-selected="true" id="tab3d" aria-controls="modelo">Modelo 3D</button><button role="tab" aria-selected="false" id="tab2d" aria-controls="planta">Planta 2D</button></div>
<div id="area"><canvas id="modelo" role="tabpanel" aria-label="Modelo 3D"></canvas><canvas id="planta" role="tabpanel" aria-label="Planta 2D" hidden></canvas>
<div id="ferramentas"><button id="enquadrar">Enquadrar</button><label id="referencia"><input type="checkbox" id="pessoa"> Pessoa · 1,70 m</label><span id="zoom" hidden><button id="menos" aria-label="Diminuir zoom">−</button><button id="mais" aria-label="Aumentar zoom">+</button></span></div><span id="regua"></span><strong id="medidas"></strong></div></section>
<aside><label><strong>Nome do objeto</strong><input id="nome" type="text"></label>
<section id="caixas" hidden><h3>Caixas de pontos quentes</h3><div id="listaCaixas"></div></section>
<div id="edicaoPlanta" hidden><hr><h3>Símbolo 2D</h3><select id="estilo" aria-label="Estilo da planta"><option value="vincos">Contornos e vincos visíveis</option><option value="contornos">Só contornos</option></select><p>Clique em uma linha ou arraste um retângulo. Use Shift para ampliar a seleção.</p><button id="ocultar">Ocultar trechos</button><button id="ocultarPeca">Ocultar linhas desta peça na planta</button><button id="desfazerPlanta">Desfazer edição da planta</button><button id="restaurar">Restaurar linhas ocultas</button><p id="revisar" role="status"></p></div>
<hr><h2>Dimensões</h2><label>Unidade de origem<select id="unidade"><option value="1">Metros</option><option value="0.01">Centímetros</option><option value="0.001">Milímetros</option><option value="0.0254">Polegadas</option></select></label><label>Eixo vertical<select id="eixo"><option>Z</option><option>Y</option></select></label><label>Calibrar pela dimensão<select id="dim"><option>Largura</option><option>Profundidade</option><option>Altura</option></select></label><div class="linha"><ui-number-input id="conhecida" min="0.000001" step="0.01"><ui-number-input-group><ui-number-input-control><input aria-label="Dimensão conhecida em metros"></ui-number-input-control></ui-number-input-group></ui-number-input> m <button id="calibrar">Aplicar</button></div>
<hr><label><input type="checkbox" id="cortar"> Caixa de corte</label><div id="limites" hidden></div><hr><h3>Simplificação</h3><label>Aplicar a<select id="escopo"><option value="geral">Modelo inteiro</option><option value="selecao">Por seleção</option></select></label>
<label>Método<select id="metodo"><option value="misto" disabled>Ajustes mistos</option><option value="collapse">Colapso de arestas (Collapse)</option><option value="planar">Dissolver coplanares (Planar)</option><option value="grade">Reverter subdivisão (Un-Subdivide)</option></select></label>
<label><span id="intensidade">Triângulos a manter (%)</span> <input id="valor" type="number" min="1" max="100" value="100"></label>
<button id="herdar" hidden>Voltar ao ajuste geral</button><p id="disponibilidade" role="status"></p>
<label>Comparação<select id="comparar"><option value="depois">Depois</option><option value="antes">Antes</option></select></label><p id="contagem"></p><hr><h3>Superfícies do projeto</h3><div id="materiais"></div></aside></main>
<span id="dica" role="tooltip" hidden></span><section id="contexto" aria-label="Ações da peça" hidden><strong id="tituloMenu"></strong><small id="atualMenu"></small><select id="alvoMenu" aria-label="Aplicar a"></select><button id="caixaMenu">Criar caixa de pontos quentes</button><button id="ocultarMenu">Ocultar peça</button><button id="isolarMenu">Isolar peça</button><button id="vincularMenu">Vincular superfície existente</button><button id="duplicarMenu">Duplicar superfície e vincular</button><button id="origemMenu">Voltar ao vínculo do material de origem</button></section>
<dialog id="duplicar"><h2>Duplicar superfície</h2><label>Superfície de base <button id="baseCopia"></button></label><label>Nome <input id="nomeCopia" required maxlength="255"></label><label>Cor <input type="color" id="corCopia"></label><div class="acoes"><button onclick="this.closest('dialog').close()">Cancelar</button><button id="confirmarCopia">Vincular cópia</button></div></dialog>
<footer><span role="status" id="estado">Abrindo prévia…</span><button id="cancelar">Cancelar</button><button disabled id="criar">Criar objeto</button></footer><!-- script --></html>
